name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    uses: Quantova/Quantova-Ci/.github/workflows/npm-wasm-sdk.yml@c99095f1555ecea287ed0def10449b597176bd9b
    permissions:
      contents: read
      id-token: write
    with:
      test-command: |
        set -euo pipefail
        case "$GITHUB_REF" in
          refs/tags/*) ;;
          *)
            src="$RUNNER_TEMP/qstamp"
            git init -q "$src"
            git -C "$src" fetch -q --depth 1 https://github.com/Quantova/QStamp.git ed9aab5d536a575ace7bcd06ebb5d682bc135af9
            git -C "$src" checkout -q FETCH_HEAD
            (cd "$src" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")
            npm install --no-save --ignore-scripts "$RUNNER_TEMP"/quantovainc-qstamp-*.tgz
            ;;
        esac
        npm test
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
