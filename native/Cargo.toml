[package]
name = "qmandate-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
description = "ML-DSA-65 mandate and action signing for QMandate, built on Quantova Q-Crypto"
repository = "https://github.com/Quantova/QMandate"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "e47d6cd94e71c13b22e2990f8c2b0a2e3a2204d0", default-features = false }
wasm-bindgen = "=0.2.126"
zeroize = { version = "=1.9.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
